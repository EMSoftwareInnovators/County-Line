<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>COUNTY LINE</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23121110'/%3E%3Crect x='2' y='7' width='12' height='2' fill='%23c8b46a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<div id="cabinet">
  <canvas id="screen" width="320" height="240"></canvas>

  <!-- ============ HUD ============ -->
  <div id="hud" class="layer hidden">
    <div id="clock" class="hidden"><span id="clock-time"></span><span id="clock-label"></span></div>
    <div id="reticle"></div>
    <div id="prompt-wrap">
      <div id="prompt"></div>
      <div id="prompt-sub"></div>
    </div>
    <div id="objective" class="hidden"></div>
    <div id="toasts"></div>
  </div>

  <!-- ============ NOTICE ============ -->
  <div id="notice" class="layer hidden"></div>

  <!-- ============ TITLE ============ -->
  <div id="title" class="layer">
    <div class="title-wrap">
      <div class="title-logo"><span class="l1">COUNTY</span><span class="l2">LINE</span></div>
      <p class="tag">TECHNICAL FOUNDATION &middot; STAGE 1</p>
      <ul id="title-menu"></ul>
      <p class="hint">arrows / stick &middot; ENTER to select</p>
    </div>
    <p class="copyright">&copy; 2026 EM Software Innovators</p>
  </div>

  <!-- ============ PANEL (settings / controls / pause) ============ -->
  <div id="panel" class="layer hidden"><div class="pad" id="panel-body"></div></div>

  <!-- ============ DEBUG ============ -->
  <div id="debug" class="layer hidden"></div>

  <div id="fade" class="layer"></div>
</div>
<div id="rotate">TURN DEVICE / USE A LARGER SCREEN</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
